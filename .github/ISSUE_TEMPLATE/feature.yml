name: Feature request
description: A feature that has been discussed and is ready to be considered for development
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Still a rough idea? Please start in [Discussions → Ideas](https://github.com/Sqhh99/FLiNG-Downloader/discussions/categories/ideas) first.

        This form is for requests that can already say what problem they solve.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you file
      options:
        - label: I searched Issues and Discussions and found no duplicate
          required: true
        - label: I describe the problem to solve, not only a way to implement it
          required: true

  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      description: Link to the Discussion where this was agreed, if there is one.
      placeholder: https://github.com/Sqhh99/FLiNG-Downloader/discussions/...

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Where does your current workflow get stuck? Who would use this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How you would use it
      description: What you would click and what you would see. Implementation details are optional.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: What you do today instead, and other approaches you considered.

  - type: textarea
    id: extras
    attributes:
      label: Anything else
      description: How similar apps handle it, sketches, and whether you would like to open the PR yourself.
