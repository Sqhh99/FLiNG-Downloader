name: Bug report
description: A crash, failed search, broken download, or other problem you can reproduce
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you file:

        - Install the [latest release](https://github.com/Sqhh99/FLiNG-Downloader/releases/latest) and check that the problem is still there.
        - If your antivirus blocked or deleted the app, read the [antivirus FAQ](https://github.com/Sqhh99/FLiNG-Downloader/blob/main/docs/ANTIVIRUS_FAQ.md) instead of opening an Issue.
        - A Chinese or Japanese game title that doesn't find its trainer? Use the **Game title not found** form instead.

        English, Chinese, and Japanese are all fine.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you file
      options:
        - label: I am on the latest official release, not a build I made myself
          required: true
        - label: I searched the existing Issues and found no report of this
          required: true
        - label: This is not an antivirus false positive
          required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under Settings → About, or in the installer's file name.
      placeholder: v1.1.10
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: How you installed it
      options:
        - Portable zip
        - Installer (setup.exe)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - Search or the home list
        - Downloading a trainer
        - Game covers
        - Downloaded trainers (library, running, deleting)
        - App or database updates
        - Settings, theme, or language
        - Startup or crash
        - Other
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - 简体中文
        - English
        - 日本語

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: In your own words, please. Include any error message exactly as shown.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the game or trainer name if it only happens with one.
      placeholder: |
        1. Open the app
        2. Search for "..."
        3. Click Download
        4. ...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details
      description: Drag screenshots in here. Remove your user name and other personal details from any paths.
