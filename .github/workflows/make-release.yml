name: Make Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v), optional for manual runs"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIST_DIR: "dist/FLiNG Downloader"
  INSTALLER_DIR: "dist/installer"

jobs:
  make-release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Puts VCToolsRedistDir on the environment for `cargo xtask dist`.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install packaging tools
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          } elseif ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "0.0.0-dev.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version"

      - name: Build and package
        id: package
        shell: pwsh
        run: |
          cargo xtask dist --version "${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) {
            throw "cargo xtask dist failed with exit code $LASTEXITCODE"
          }
          $distDir = Join-Path $env:GITHUB_WORKSPACE $env:DIST_DIR
          foreach ($relativePath in @(
            "FLiNG Downloader.exe",
            "models\game-cover-v2.onnx",
            "resources\fling_translations.db",
            "vcruntime140.dll",
            "msvcp140.dll"
          )) {
            if (!(Test-Path (Join-Path $distDir $relativePath))) {
              throw "Missing packaged file: $relativePath"
            }
          }
          $sizeBytes = (Get-ChildItem -Path $distDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          "dist_dir=$distDir" >> $env:GITHUB_OUTPUT
          "size_mb=$([Math]::Round($sizeBytes / 1MB, 2))" >> $env:GITHUB_OUTPUT

      - name: Smoke test packaged app startup
        shell: pwsh
        run: |
          $appExe = Join-Path "${{ steps.package.outputs.dist_dir }}" "FLiNG Downloader.exe"
          if (!(Test-Path $appExe)) {
            throw "Packaged app not found: $appExe"
          }

          $proc = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) {
              throw "Smoke test failed: process exited early with code $($proc.ExitCode)"
            }
          } else {
            Stop-Process -Id $proc.Id -Force
          }

      - name: Publish packaging size report
        shell: pwsh
        run: |
          @"
          ### Packaging Size Report
          - Package folder: ${{ steps.package.outputs.size_mb }} MB
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Create portable release zip
        id: portable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $distDir = "${{ steps.package.outputs.dist_dir }}"
          $distRootDir = Split-Path -Parent $distDir
          $distTopFolder = Split-Path -Leaf $distDir
          $portableZip = Join-Path $workspace ("dist\FLiNG-Downloader-v{0}-win-x64-portable.zip" -f "${{ steps.version.outputs.version }}")

          if (Test-Path $portableZip) {
            Remove-Item -Force $portableZip
          }

          Push-Location $distRootDir
          try {
            Compress-Archive -Path $distTopFolder -DestinationPath $portableZip -CompressionLevel Optimal
          } finally {
            Pop-Location
          }

          "portable_zip=$portableZip" >> $env:GITHUB_OUTPUT

      - name: Build Inno Setup installer
        id: installer
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $workspace "tools\FLiNG Downloader-Setup.iss"
          $distDir = "${{ steps.package.outputs.dist_dir }}"
          $outputDir = Join-Path $workspace $env:INSTALLER_DIR
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $isccPath)) {
            throw "ISCC not found: $isccPath"
          }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          & $isccPath "/DSourceRoot=$workspace" "/DDistDir=$distDir" "/DOutputDir=$outputDir" "/DAppVersion=${{ steps.version.outputs.version }}" "$scriptPath"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $installerFile = Get-ChildItem -Path $outputDir -File -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installerFile) {
            throw "No installer generated in $outputDir"
          }

          "installer_exe=$($installerFile.FullName)" >> $env:GITHUB_OUTPUT

      - name: Write checksums and release notes
        id: checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $portableZip = "${{ steps.portable.outputs.portable_zip }}"
          $installerExe = "${{ steps.installer.outputs.installer_exe }}"
          $sumsPath = Join-Path $workspace "dist\SHA256SUMS.txt"
          $notesPath = Join-Path $workspace "dist\RELEASE_INTRO.md"

          $lines = @()
          foreach ($path in @($portableZip, $installerExe)) {
            if (!(Test-Path $path)) {
              throw "Missing artifact for checksum: $path"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $path
            $lines += "$hash  $name"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllLines($sumsPath, $lines, $utf8NoBom)

          $faq = 'https://github.com/Sqhh99/FLiNG-Downloader/blob/main/docs/ANTIVIRUS_FAQ.md'
          $intro = @(
            '## Download',
            '',
            '| File | What it is |',
            '|------|------------|',
            "| ``$(Split-Path -Leaf $installerExe)`` | Installer. Installs over an older version and keeps your settings, downloaded trainers and covers. |",
            "| ``$(Split-Path -Leaf $portableZip)`` | Portable. Unzip anywhere and run ``FLiNG Downloader.exe``. |",
            '| `SHA256SUMS.txt` | SHA-256 checksums of both files. |',
            '',
            '- Windows 10 / 11, x64. Download only from this GitHub Releases page.',
            "- Windows Defender or another antivirus may flag the app by mistake; see the [antivirus FAQ]($faq).",
            '',
            '<details><summary>简体中文</summary>',
            '',
            '- **安装包**（setup.exe）：可直接覆盖安装旧版本，设置、已下载的修改器和封面都会保留。',
            '- **便携包**（zip）：解压后运行 `FLiNG Downloader.exe`。',
            '- 用附件 `SHA256SUMS.txt` 校验文件；请只从本页面下载。',
            "- 杀毒软件可能误报，见 [杀毒 FAQ]($faq)。",
            '',
            '</details>',
            '',
            '<details><summary>日本語</summary>',
            '',
            '- **インストーラー**（setup.exe）：旧バージョンに上書きでき、設定・ダウンロード済みトレーナー・カバーは保持されます。',
            '- **ポータブル版**（zip）：展開して `FLiNG Downloader.exe` を実行します。',
            '- 添付の `SHA256SUMS.txt` でファイルを検証してください。ダウンロードはこのページからのみ行ってください。',
            "- ウイルス対策ソフトが誤検知する場合は [FAQ]($faq) を参照してください。",
            '',
            '</details>',
            ''
          )
          [System.IO.File]::WriteAllLines($notesPath, $intro, $utf8NoBom)

          "sums=$sumsPath" >> $env:GITHUB_OUTPUT
          "notes=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLiNG-Downloader-Windows-x64-portable
          path: ${{ steps.package.outputs.dist_dir }}
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLiNG-Downloader-Windows-x64-setup
          path: ${{ steps.installer.outputs.installer_exe }}
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.portable.outputs.portable_zip }}
            ${{ steps.installer.outputs.installer_exe }}
            ${{ steps.checksums.outputs.sums }}
          body_path: ${{ steps.checksums.outputs.notes }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
